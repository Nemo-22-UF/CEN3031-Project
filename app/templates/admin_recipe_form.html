{% extends "base.html" %}

{% block title %}{{ heading }}{% endblock %}

{% block content %}
<section class="admin">
    <h1>{{ heading }}</h1>

    {% if error %}
    <p class="form-error" role="alert">{{ error }}</p>
    {% endif %}

    <form method="post" class="auth-form admin-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="title">Title</label>
        <input id="title" name="title" type="text" value="{{ values.title }}" minlength="3" maxlength="100" required>

        <label for="servings">Serves</label>
        <input id="servings" name="servings" type="number" value="{{ values.servings }}" min="1" max="20" required>

        <label for="ingredients">Ingredients</label>
        <textarea id="ingredients" name="ingredients" rows="6" required>{{ values.ingredients }}</textarea>
        <p class="auth-hint">One per line, like "2 tbsp butter", "3 eggs" or "Salt, to taste".</p>

        <label for="steps">Steps</label>
        <textarea id="steps" name="steps" rows="8" required>{{ values.steps }}</textarea>
        <p class="auth-hint">One step per line, in order.</p>

        <button class="button" type="submit">Save recipe</button>
    </form>

    <p class="auth-switch"><a href="{{ url_for('admin.recipe_list') }}">Back to recipes</a></p>
</section>
{% endblock %}
